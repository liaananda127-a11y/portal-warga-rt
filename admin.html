<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Portal Warga RT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f7f5;
      color: #26352e;
    }

    header {
      background: #176b4d;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 23px;
    }

    header p {
      font-size: 13px;
      margin-top: 6px;
      opacity: 0.9;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, .btn {
      border: none;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
    }

    .btn-light {
      background: white;
      color: #176b4d;
    }

    .btn-logout {
      background: #d9534f;
      color: white;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #65746b;
      line-height: 1.6;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .panel h3 {
      margin-bottom: 20px;
      color: #176b4d;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d4ded8;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #176b4d;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
    }

    .checkbox-group input {
      width: auto;
    }

    .checkbox-group label {
      margin: 0;
      font-weight: normal;
    }

    .btn-primary {
      background: #176b4d;
      color: white;
    }

    .btn-secondary {
      background: #e5ece8;
      color: #26352e;
    }

    .btn-edit {
      background: #f0b429;
      color: #26352e;
    }

    .btn-delete {
      background: #d9534f;
      color: white;
    }

    .btn-status {
      background: #dcefe5;
      color: #176b4d;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .announcement-list {
      display: grid;
      gap: 15px;
    }

    .announcement-card {
      border: 1px solid #e0e8e3;
      border-radius: 10px;
      padding: 20px;
    }

    .announcement-card h4 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .announcement-card p {
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .announcement-date {
      font-size: 13px;
      color: #68766e;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .active {
      background: #d9f3e4;
      color: #176b4d;
    }

    .inactive {
      background: #fce5e5;
      color: #b42318;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .card-actions button {
      padding: 9px 12px;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message-success {
      background: #d9f3e4;
      color: #176b4d;
    }

    .message-error {
      background: #fce5e5;
      color: #b42318;
    }

    .loading {
      color: #65746b;
      padding: 15px 0;
    }

    footer {
      text-align: center;
      color: #718078;
      font-size: 13px;
      padding: 25px 15px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      header h1 {
        font-size: 20px;
      }

      main {
        margin-top: 25px;
        padding: 0 14px;
      }

      .panel {
        padding: 18px;
      }

      .welcome h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <h1>Portal Warga RT</h1>
      <p>Halaman Pengelolaan Admin</p>
    </div>

    <div class="header-buttons">
      <a href="warga.html" class="btn btn-light">Dashboard Warga</a>
      <button type="button" class="btn btn-logout" id="logoutBtn">
        Keluar
      </button>
    </div>
  </header>

  <main>
    <section class="welcome">
      <h2>Dashboard Admin</h2>
      <p id="adminInfo">Memeriksa akses akun...</p>
    </section>

    <div id="pageMessage" class="message" role="status"></div>

    <section class="panel">
      <h3 id="formTitle">Tambah Pengumuman</h3>

      <div id="formMessage" class="message" role="status"></div>

      <form id="announcementForm">
        <div class="form-group">
          <label for="judul">Judul Pengumuman</label>
          <input
            type="text"
            id="judul"
            placeholder="Contoh: Kerja Bakti Warga"
            maxlength="150"
            required
          >
        </div>

        <div class="form-group">
          <label for="isi">Isi Pengumuman</label>
          <textarea
            id="isi"
            placeholder="Tulis informasi pengumuman..."
            maxlength="10000"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="tanggal">Tanggal Kegiatan</label>
          <input type="date" id="tanggal" required>
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="aktif" checked>
          <label for="aktif">Tampilkan pengumuman kepada warga</label>
        </div>

        <button type="submit" class="btn btn-primary" id="saveBtn">
          Simpan Pengumuman
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          id="cancelBtn"
          hidden
        >
          Batal Edit
        </button>
      </form>
    </section>

    <section class="panel">
      <h3>Daftar Pengumuman</h3>

      <div id="listMessage" class="message" role="status"></div>

      <div id="announcementList" class="announcement-list">
        <p class="loading">Memuat pengumuman...</p>
      </div>
    </section>
  </main>

  <footer>
    Portal Informasi dan Pelayanan Warga RT
  </footer>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      collection,
      addDoc,
      getDocs,
      getDoc,
      doc,
      updateDoc,
      deleteDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const form = document.getElementById("announcementForm");
    const judulInput = document.getElementById("judul");
    const isiInput = document.getElementById("isi");
    const tanggalInput = document.getElementById("tanggal");
    const aktifInput = document.getElementById("aktif");

    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const formTitle = document.getElementById("formTitle");
    const adminInfo = document.getElementById("adminInfo");
    const announcementList = document.getElementById("announcementList");

    const pageMessage = document.getElementById("pageMessage");
    const formMessage = document.getElementById("formMessage");
    const listMessage = document.getElementById("listMessage");

    let currentUser = null;
    let editingId = null;
    let announcements = [];
    let isAdminVerified = false;
    let busy = false;

    function showMessage(element, message, type = "success") {
      element.textContent = message;
      element.className = "message " +
        (type === "error" ? "message-error" : "message-success");
      element.style.display = "block";
    }

    function hideMessage(element) {
      element.textContent = "";
      element.style.display = "none";
    }

    function setBusy(value) {
      busy = value;
      saveBtn.disabled = value;
      logoutBtn.disabled = value;
    }

    // Memeriksa login dan role admin sebelum mengizinkan akses.
    onAuthStateChanged(auth, async (user) => {
      isAdminVerified = false;

      if (!user) {
        window.location.replace("login.html");
        return;
      }

      adminInfo.textContent = "Memeriksa hak akses admin...";

      try {
        // Ambil dokumen roles dengan Document ID = UID pengguna.
        const roleRef = doc(db, "roles", user.uid);
        const roleSnapshot = await getDoc(roleRef);

        if (!roleSnapshot.exists() ||
            roleSnapshot.data().role !== "admin") {
          window.location.replace("warga.html");
          return;
        }

        currentUser = user;
        isAdminVerified = true;

        adminInfo.textContent =
          "Login sebagai admin: " + (user.email || user.uid);

        await loadAnnouncements();

      } catch (error) {
        console.error("Pengecekan admin gagal:", error);

        adminInfo.textContent =
          "Tidak dapat memverifikasi akses admin.";

        showMessage(
          pageMessage,
          "Gagal memeriksa role admin. Periksa Firestore Rules dan koneksi internet. Detail: " +
            error.message,
          "error"
        );
      }
    });

    // Mengambil daftar pengumuman.
    async function loadAnnouncements() {
      if (!isAdminVerified) return;

      announcementList.innerHTML =
        '<p class="loading">Memuat pengumuman...</p>';

      hideMessage(listMessage);

      try {
        const snapshot = await getDocs(
          collection(db, "pengumuman")
        );

        announcements = snapshot.docs.map((item) => ({
          id: item.id,
          ...item.data()
        }));

        announcements.sort((a, b) => {
          const dateA = String(a.tanggal || "");
          const dateB = String(b.tanggal || "");
          return dateB.localeCompare(dateA);
        });

        renderAnnouncements();

      } catch (error) {
        console.error("Gagal memuat pengumuman:", error);

        announcementList.innerHTML = "";
        showMessage(
          listMessage,
          "Gagal memuat pengumuman: " + error.message,
          "error"
        );
      }
    }

    // Menampilkan daftar pengumuman.
    function renderAnnouncements() {
      announcementList.innerHTML = "";

      if (announcements.length === 0) {
        announcementList.innerHTML =
          '<p class="loading">Belum ada pengumuman.</p>';
        return;
      }

      announcements.forEach((item) => {
        const card = document.createElement("article");
        card.className = "announcement-card";

        const title = document.createElement("h4");
        title.textContent = item.judul || "Tanpa judul";

        const date = document.createElement("div");
        date.className = "announcement-date";
        date.textContent = "Tanggal kegiatan: " +
          (item.tanggal || "-");

        const content = document.createElement("p");
        content.textContent = item.isi || "";

        const badge = document.createElement("span");
        const isActive = item.aktif === true;

        badge.className = "badge " +
          (isActive ? "active" : "inactive");

        badge.textContent = isActive
          ? "Aktif — tampil untuk warga"
          : "Nonaktif — tidak tampil untuk warga";

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "btn btn-edit";
        editBtn.textContent = "Edit";

        editBtn.addEventListener("click", () => {
          startEdit(item.id);
        });

        const statusBtn = document.createElement("button");
        statusBtn.type = "button";
        statusBtn.className = "btn btn-status";
        statusBtn.textContent = isActive
          ? "Nonaktifkan"
          : "Aktifkan";

        statusBtn.addEventListener("click", () => {
          toggleStatus(item.id, isActive);
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "btn btn-delete";
        deleteBtn.textContent = "Hapus";

        deleteBtn.addEventListener("click", () => {
          removeAnnouncement(item.id);
        });

        actions.append(editBtn, statusBtn, deleteBtn);
        card.append(title, date, content, badge, actions);
        announcementList.appendChild(card);
      });
    }

    // Menambah atau menyimpan perubahan pengumuman.
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!isAdminVerified || !currentUser) {
        showMessage(
          formMessage,
          "Akses admin belum terverifikasi.",
          "error"
        );
        return;
      }

      if (busy) return;

      const title = judulInput.value.trim();
      const content = isiInput.value.trim();
      const date = tanggalInput.value;
      const isActive = aktifInput.checked;

      if (!title || !content || !date) {
        showMessage(
          formMessage,
          "Semua kolom wajib diisi.",
          "error"
        );
        return;
      }

      setBusy(true);
      hideMessage(formMessage);

      try {
        const data = {
          judul: title,
          isi: content,
          tanggal: date,
          aktif: isActive,
          updatedAt: serverTimestamp()
        };

        if (editingId) {
          await updateDoc(
            doc(db, "pengumuman", editingId),
            data
          );

          showMessage(
            formMessage,
            "Pengumuman berhasil diperbarui."
          );
        } else {
          data.createdAt = serverTimestamp();

          await addDoc(
            collection(db, "pengumuman"),
            data
          );

          showMessage(
            formMessage,
            "Pengumuman berhasil ditambahkan."
          );
        }

        resetForm();
        await loadAnnouncements();

      } catch (error) {
        console.error("Gagal menyimpan pengumuman:", error);

        showMessage(
          formMessage,
          "Gagal menyimpan pengumuman: " + error.message,
          "error"
        );
      } finally {
        setBusy(false);
      }
    });

    // Memasukkan data ke form untuk diedit.
    function startEdit(id) {
      if (!isAdminVerified) return;

      const item = announcements.find((entry) => entry.id === id);

      if (!item) return;

      editingId = id;

      judulInput.value = item.judul || "";
      isiInput.value = item.isi || "";
      tanggalInput.value = item.tanggal || "";
      aktifInput.checked = item.aktif === true;

      formTitle.textContent = "Edit Pengumuman";
      saveBtn.textContent = "Simpan Perubahan";
      cancelBtn.hidden = false;

      hideMessage(formMessage);

      form.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }

    // Membatalkan proses edit.
    function resetForm() {
      editingId = null;
      form.reset();

      aktifInput.checked = true;

      formTitle.textContent = "Tambah Pengumuman";
      saveBtn.textContent = "Simpan Pengumuman";
      cancelBtn.hidden = true;
    }

    cancelBtn.addEventListener("click", () => {
      resetForm();
      hideMessage(formMessage);
    });

    // Mengaktifkan atau menonaktifkan pengumuman.
    async function toggleStatus(id, currentStatus) {
      if (!isAdminVerified || busy) return;

      setBusy(true);
      hideMessage(listMessage);

      try {
        await updateDoc(
          doc(db, "pengumuman", id),
          {
            aktif: !currentStatus,
            updatedAt: serverTimestamp()
          }
        );

        showMessage(
          listMessage,
          currentStatus
            ? "Pengumuman berhasil dinonaktifkan."
            : "Pengumuman berhasil diaktifkan."
        );

        await loadAnnouncements();

      } catch (error) {
        console.error("Gagal mengubah status:", error);

        showMessage(
          listMessage,
          "Gagal mengubah status: " + error.message,
          "error"
        );
      } finally {
        setBusy(false);
      }
    }

    // Menghapus pengumuman.
    async function removeAnnouncement(id) {
      if (!isAdminVerified || busy) return;

      const confirmed = window.confirm(
        "Yakin ingin menghapus pengumuman ini?"
      );

      if (!confirmed) return;

      setBusy(true);
      hideMessage(listMessage);

      try {
        await deleteDoc(doc(db, "pengumuman", id));

        if (editingId === id) {
          resetForm();
        }

        showMessage(
          listMessage,
          "Pengumuman berhasil dihapus."
        );

        await loadAnnouncements();

      } catch (error) {
        console.error("Gagal menghapus pengumuman:", error);

        showMessage(
          listMessage,
          "Gagal menghapus pengumuman: " + error.message,
          "error"
        );
      } finally {
        setBusy(false);
      }
    }

    // Logout.
    logoutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.replace("login.html");
      } catch (error) {
        console.error("Logout gagal:", error);

        showMessage(
          pageMessage,
          "Gagal logout: " + error.message,
          "error"
        );
      }
    });
  </script>

</body>
</html>
