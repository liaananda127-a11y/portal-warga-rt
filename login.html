<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal RT</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #dff8e8, #b5e8ce);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(34, 100, 66, 0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #e1f7e9;
            font-size: 35px;
        }

        h1 {
            color: #246b45;
            font-size: 27px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718078;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #34483b;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8e5dc;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #43a66c;
            box-shadow: 0 0 0 3px rgba(67, 166, 108, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #388557;
            font-size: 12px;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: #31945a;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #267746;
        }

        .login-button:disabled {
            background: #91bda1;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            color: #a52d2d;
            background: #fff0f0;
            border: 1px solid #f3caca;
        }

        .message.success {
            display: block;
            color: #246b45;
            background: #eaf8ef;
            border: 1px solid #c8ead3;
        }

        .back-link {
            display: block;
            margin-top: 24px;
            color: #388557;
            text-align: center;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #96a49b;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="logo">🏡</div>

        <h1>Portal RT</h1>

        <p class="subtitle">
            Selamat datang!<br>
            Silakan login untuk mengakses layanan warga.
        </p>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        Lihat
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <a href="index.html" class="back-link">
            ← Kembali ke halaman utama
        </a>

        <div class="footer">
            &copy; 2026 Portal Informasi dan Pelayanan Warga
        </div>

    </main>

    <script type="module">
        import { auth, db } from "./firebase.js";

        import {
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        import {
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginButton = document.getElementById("loginButton");
        const messageBox = document.getElementById("message");
        const togglePassword = document.getElementById("togglePassword");

        let isProcessing = false;

        function showMessage(message, type = "error") {
            messageBox.textContent = message;
            messageBox.className = `message ${type}`;
        }

        function hideMessage() {
            messageBox.textContent = "";
            messageBox.className = "message";
        }

        function setLoading(loading, text = "Memproses...") {
            loginButton.disabled = loading;
            loginButton.textContent = loading ? text : "Login";
        }

        function getLoginErrorMessage(error) {
            switch (error.code) {
                case "auth/invalid-email":
                    return "Format email tidak valid.";

                case "auth/invalid-credential":
                case "auth/wrong-password":
                case "auth/user-not-found":
                    return "Email atau password salah.";

                case "auth/user-disabled":
                    return "Akun ini telah dinonaktifkan.";

                case "auth/too-many-requests":
                    return "Terlalu banyak percobaan. Silakan coba lagi nanti.";

                case "auth/network-request-failed":
                    return "Koneksi internet bermasalah. Periksa koneksi kamu.";

                default:
                    return "Login gagal. Silakan periksa kembali data akun kamu.";
            }
        }

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";
            togglePassword.textContent = isPassword ? "Sembunyikan" : "Lihat";
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (isProcessing) return;

            hideMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            isProcessing = true;
            setLoading(true, "Memeriksa akun...");

            try {
                // 1. Memverifikasi email dan password melalui Firebase Authentication.
                const credential = await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );

                const user = credential.user;

                // 2. Mengambil role berdasarkan UID pengguna yang login.
                const roleRef = doc(db, "roles", user.uid);
                const roleSnapshot = await getDoc(roleRef);

                // 3. Mengarahkan pengguna sesuai role di Firestore.
                if (
                    roleSnapshot.exists() &&
                    roleSnapshot.data().role === "admin"
                ) {
                    showMessage("Login berhasil. Mengarahkan ke dashboard admin...", "success");

                    window.location.replace("admin.html");
                } else {
                    showMessage("Login berhasil. Mengarahkan ke halaman warga...", "success");

                    window.location.replace("warga.html");
                }

            } catch (error) {
                console.error("Login error:", error);

                if (
                    error.code === "permission-denied" ||
                    error.code === "firestore/permission-denied"
                ) {
                    showMessage(
                        "Tidak dapat memeriksa role akun. Periksa Firestore Rules dan pastikan dokumen roles sesuai dengan UID akun."
                    );
                } else if (
                    error.code === "unavailable" ||
                    error.code === "failed-precondition"
                ) {
                    showMessage(
                        "Firestore tidak dapat diakses. Periksa koneksi dan konfigurasi database."
                    );
                } else if (error.code && error.code.startsWith("auth/")) {
                    showMessage(getLoginErrorMessage(error));
                } else {
                    showMessage(
                        "Terjadi kesalahan saat login. Periksa koneksi dan konfigurasi Firebase."
                    );
                }

            } finally {
                isProcessing = false;
                setLoading(false);
            }
        });
    </script>

</body>
</html>
