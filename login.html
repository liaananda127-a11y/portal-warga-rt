<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Portal Warga RT</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #e7f5ed, #c8e8d6);
      color: #26352e;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(23, 107, 77, 0.12);
    }

    .logo {
      width: 65px;
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      background: #d9f3e4;
      border-radius: 18px;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      color: #176b4d;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #718078;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5e1d9;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #24865f;
      box-shadow: 0 0 0 3px rgba(36, 134, 95, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #176b4d;
      cursor: pointer;
      font-size: 12px;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #176b4d;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
      transition: background 0.2s;
    }

    .login-button:hover {
      background: #10583e;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fce8e6;
      color: #b42318;
    }

    .message.info {
      display: block;
      background: #e4f4eb;
      color: #176b4d;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #176b4d;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #89958e;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="logo">🏡</div>

    <h1>Portal Warga RT</h1>

    <p class="subtitle">
      Selamat datang!<br>
      Silakan login untuk mengakses layanan warga.
    </p>

    <div
      id="message"
      class="message"
      role="alert"
      aria-live="polite"
    ></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
          >
            Lihat
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <a href="index.html" class="back-link">
      ← Kembali ke Beranda
    </a>

    <div class="footer">
      Portal Informasi dan Pelayanan Warga RT
    </div>

  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const messageBox = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    let checkingSession = false;

    function showMessage(message, type = "error") {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function hideMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function setLoading(loading) {
      loginButton.disabled = loading;
      loginButton.textContent = loading
        ? "Memeriksa akun..."
        : "Login";
    }

    function getLoginErrorMessage(error) {
      switch (error.code) {
        case "auth/invalid-credential":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Email atau password tidak sesuai.";

        case "auth/invalid-email":
          return "Format email tidak valid.";

        case "auth/too-many-requests":
          return "Terlalu banyak percobaan. Coba lagi nanti.";

        case "auth/network-request-failed":
          return "Koneksi internet bermasalah. Periksa koneksi kamu.";

        case "auth/operation-not-allowed":
          return "Login email/password belum diaktifkan di Firebase.";

        default:
          return "Login gagal. Silakan coba kembali.";
      }
    }

    // Memeriksa apakah pengguna sudah login.
    // Jika sudah, arahkan sesuai role.
    async function redirectByRole(user) {
      if (checkingSession) return;

      checkingSession = true;
      setLoading(true);

      try {
        const roleRef = doc(db, "roles", user.uid);
        const roleSnapshot = await getDoc(roleRef);

        if (roleSnapshot.exists() &&
            roleSnapshot.data().role === "admin") {
          window.location.replace("admin.html");
        } else {
          window.location.replace("warga.html");
        }
      } catch (error) {
        console.error("Pemeriksaan role gagal:", error);

        checkingSession = false;
        setLoading(false);

        showMessage(
          "Gagal memeriksa hak akses akun. Periksa Firestore Rules dan coba lagi."
        );
      }
    }

    // Jika sudah login dan membuka login.html,
    // arahkan langsung sesuai role.
    onAuthStateChanged(auth, (user) => {
      if (user && !checkingSession) {
        redirectByRole(user);
      }
    });

    // Proses login.
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (checkingSession) return;

      hideMessage();
      setLoading(true);

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        // Pemeriksaan role dilakukan setelah login berhasil.
        await redirectByRole(credential.user);

      } catch (error) {
        console.error("Login gagal:", error);

        checkingSession = false;
        setLoading(false);

        showMessage(getLoginErrorMessage(error));
      }
    });

    // Tombol untuk melihat/menyembunyikan password.
    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "Sembunyikan" : "Lihat";
    });
  </script>

</body>
</html>
